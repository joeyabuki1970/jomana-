<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMANA | SPECIAL GIFT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050005;
            color: #ff007f;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Matrix Rain Canvas */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.35;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            background: rgba(10, 0, 10, 0.85);
            border: 2px solid #ff007f;
            box-shadow: 0 0 25px #ff007f, inset 0 0 15px #ff007f;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        /* Heart Style */
        .heart-box {
            font-size: 80px;
            color: #ff007f;
            text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f;
            animation: pulse 1.2s infinite ease-in-out;
            margin-bottom: 15px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px #ff007f;
            letter-spacing: 2px;
        }

        /* Countdown Grid */
        .countdown-grid {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            direction: ltr;
        }

        .time-box {
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid #ff007f;
            padding: 10px;
            border-radius: 8px;
            min-width: 65px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .time-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px #ff007f;
        }

        .time-label {
            font-size: 0.75rem;
            color: #ff007f;
            margin-top: 4px;
        }

        /* Dev Bypass Input */
        .bypass-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 0, 127, 0.4);
        }

        .bypass-input {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ff007f;
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            text-align: center;
            outline: none;
            font-size: 0.9rem;
            width: 220px;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
        }

        .bypass-input::placeholder {
            color: rgba(255, 0, 127, 0.6);
        }

        /* Poetry Gift Content */
        #secretContent {
            display: none;
            animation: fadeIn 1.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poem-text {
            color: #fff;
            font-size: 1.1rem;
            line-height: 2.2;
            text-shadow: 0 0 10px #ff007f;
            margin: 20px 0;
            white-space: pre-line;
        }

        .music-btn {
            background: #ff007f;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff007f;
            margin-top: 15px;
            transition: 0.3s;
        }

        .music-btn:hover {
            transform: scale(1.05);
            background: #ff3399;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <!-- LOCKED SCREEN -->
    <div class="container" id="lockScreen">
        <div class="heart-box">♥</div>
        <h1>WAITING FOR JOMANA'S DAY</h1>
        
        <div class="countdown-grid">
            <div class="time-box">
                <div class="time-number" id="days">00</div>
                <div class="time-label">DAYS</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">HOURS</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">MINS</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">SECS</div>
            </div>
        </div>

        <!-- Dev Password Test -->
        <div class="bypass-section">
            <input type="text" id="devPass" class="bypass-input" placeholder="Password..." oninput="checkDevPass()">
        </div>
    </div>

    <!-- UNLOCKED GIFT SCREEN -->
    <div class="container" id="secretContent">
        <div class="heart-box">💖</div>
        <h1>كل سنة وأنتي طيبة يا جومانا 🎉✨</h1>
        
        <div class="poem-text">
            لو باتَ سهمٌ من الأعداء في كبدي.. ما نال مني ما نالتْهُ عيناكِ
            
            أغزلها وأسرف في هواها.. كأن الله لم يخلق سواها
            
            ولو عينيَّ رأت وجهاً جميلاً.. فإني دون ما وعي أراها، لكن بقلبي... ❤️
        </div>

        <button class="music-btn" onclick="toggleAudio()">🎵 شغل الموسيقى</button>
        <audio id="bgAudio" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=slowed-guitar-113532.mp3"></audio>
    </div>

    <script>
        // Matrix Background
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrixChars = "LOVE YOU JOMANA 1129 ♥ 01";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 0, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff007f';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // Countdown Logic (29 Nov 2026)
        const targetDate = new Date('November 29, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                unlockContent();
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(d).padStart(2, '0');
            document.getElementById('hours').innerText = String(h).padStart(2, '0');
            document.getElementById('minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('seconds').innerText = String(s).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // DEV SECRET PASSWORD
        const MY_SECRET_PASS = "you're my love";

        function checkDevPass() {
            const inputVal = document.getElementById('devPass').value.trim().toLowerCase();
            if (inputVal === MY_SECRET_PASS.toLowerCase()) {
                unlockContent();
            }
        }

        function unlockContent() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('secretContent').style.display = 'block';
        }

        // Audio Toggle
        function toggleAudio() {
            const audio = document.getElementById('bgAudio');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
