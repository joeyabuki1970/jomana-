<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jomana 💖✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050505;
            color: #FFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الماتريكس */
        .matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            opacity: 0.18;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
        }

        .matrix-column {
            color: #FF3399;
            font-family: monospace;
            font-size: 1.2rem;
            writing-mode: vertical-rl;
            text-orientation: upright;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 2;
            position: relative;
            max-width: 500px;
            width: 90%;
        }

        /* تصميم الكارت العام */
        .book-card {
            background: rgba(15, 15, 25, 0.88);
            border: 2px solid rgba(255, 51, 153, 0.6);
            box-shadow: 0 0 35px rgba(255, 51, 153, 0.4);
            border-radius: 24px;
            padding: 35px 20px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            backdrop-filter: blur(6px);
        }

        /* شاشة العد التنازلي المقفولة */
        .lock-screen h2 {
            font-size: 1.1rem;
            color: #ff3399;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .countdown-box {
            background: rgba(255, 51, 153, 0.1);
            border: 1px solid #ff3399;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1rem;
            color: #fff;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 51, 153, 0.2);
            letter-spacing: 1px;
        }

        .bypass-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff3399;
            color: #fff;
            padding: 10px 15px;
            border-radius: 12px;
            text-align: center;
            outline: none;
            font-size: 0.95rem;
            width: 80%;
            max-width: 240px;
            box-shadow: 0 0 10px rgba(255, 51, 153, 0.3);
            margin-top: 10px;
        }

        .bypass-input::placeholder {
            color: rgba(255, 51, 153, 0.5);
        }

        /* القلب القديم الأصلي */
        .heart-container {
            position: relative;
            width: 130px;
            height: 120px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: heartbeat 1.2s infinite;
        }

        .heart-container svg {
            width: 100%;
            height: 100%;
            fill: #FF3399;
            filter: drop-shadow(0 0 20px #FF3399);
        }

        .heart-text {
            position: absolute;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* نصوص الشعر */
        .poem-text {
            font-size: 1.2rem;
            line-height: 2.2;
            color: #FFF;
            text-shadow: 0 0 10px rgba(255, 51, 153, 0.6);
            margin-bottom: 25px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* أزرار التنقل */
        .nav-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            background: #FF3399;
            color: #FFF;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 51, 153, 0.6);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #ff1a8c;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #FF3399;
            color: #FF3399;
        }

        .btn-secondary:hover {
            background: rgba(255, 51, 153, 0.1);
            color: #fff;
        }

        .page-indicator {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #ff3399;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- خلفية الماتريكس -->
    <div class="matrix-bg" id="matrixBg"></div>

    <div class="container">
        <!-- الشاشة المقفولة والعد التنازلي -->
        <div class="book-card" id="lockScreen">
            <div class="lock-screen">
                <div class="heart-container" style="transform: scale(0.8); margin-bottom: 10px;">
                    <svg viewBox="0 0 32 29.6">
                        <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                        c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/>
                    </svg>
                    <span class="heart-text">jomana</span>
                </div>
                <h2>انتظار يوم الميلاد ✨</h2>
                <div class="countdown-box" id="countdownTimer">جاري الحساب...</div>
                <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px;">أو أدخل كلمة المرور للتجربة:</div>
                <input type="text" id="devPass" class="bypass-input" placeholder="Password..." oninput="checkDevPass()">
            </div>
        </div>

        <!-- شاشة محتوى الصفحات (مخفية حتى يفتح) -->
        <div class="book-card" id="contentScreen" style="display: none;">
            <div class="heart-container">
                <svg viewBox="0 0 32 29.6">
                    <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                    c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/>
                </svg>
                <span class="heart-text">jomana</span>
            </div>

            <div class="poem-text" id="poemText">
                <!-- النص يتغير هنا بالترتيب -->
            </div>

            <div class="nav-buttons" id="navButtons">
                <button class="btn btn-secondary" id="prevBtn" onclick="changePage(-1)" style="display: none;">السابق</button>
                <button class="btn" id="nextBtn" onclick="changePage(1)">التالي ⬅</button>
            </div>

            <div class="page-indicator" id="pageIndicator">صفحة 1 من 4</div>
        </div>
    </div>

    <script>
        // توليد تأثير الماتريكس
        const matrixBg = document.getElementById('matrixBg');
        const chars = "JOMANA 2026 ♥ 1129";
        for (let i = 0; i < 15; i++) {
            const col = document.createElement('div');
            col.className = 'matrix-column';
            col.style.animationDuration = (3 + Math.random() * 5) + 's';
            col.style.animationDelay = (Math.random() * 3) + 's';
            let text = "";
            for (let j = 0; j < 20; j++) {
                text += chars.charAt(Math.floor(Math.random() * chars.length)) + "<br>";
            }
            col.innerHTML = text;
            matrixBg.appendChild(col);
        }

        // صفحات الشعر والمعايدة
        const pages = [
            "لو باتَ سهمٌ من الأعداء في كبدي.. ما نال مني ما نالتْهُ عيناكِ",
            "أغزلها وأسرف في هواها.. كأن الله لم يخلق سواها",
            "ولو عينيَّ رأت وجهاً جميلاً.. فإني دون ما وعي أراها، لكن بقلبي... ❤️",
            "كل سنة وأنتي طيبة يا جومانا 🎉✨"
        ];

        let currentPage = 0;

        function updatePage() {
            document.getElementById('poemText').innerText = pages[currentPage];
            document.getElementById('pageIndicator').innerText = `صفحة ${currentPage + 1} من ${pages.length}`;
            
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (currentPage === 0) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
            }

            if (currentPage === pages.length - 1) {
                nextBtn.style.display = 'none'; // إخفاء التالي في الصفحة الأخيرة لتكون النهاية المعايدة
            } else {
                nextBtn.style.display = 'block';
                nextBtn.innerHTML = "التالي ⬅";
            }
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage >= 0 && currentPage < pages.length) {
                updatePage();
            }
        }

        // العد التنازلي لـ 29 نوفمبر 2026
        const targetDate = new Date('November 29, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                unlockSite();
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('countdownTimer').innerText = `باقي لعيد الميلاد: ${days} يوم ${hours}س ${mins}د ${secs}ث ⏳`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // كلمة المرور السرية للمطور
        const MY_SECRET_PASS = "you're my love";

        function checkDevPass() {
            const val = document.getElementById('devPass').value.trim().toLowerCase();
            if (val === MY_SECRET_PASS.toLowerCase()) {
                unlockSite();
            }
        }

        function unlockSite() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('contentScreen').style.display = 'flex';
            updatePage();
        }
    </script>
</body>
</html>
