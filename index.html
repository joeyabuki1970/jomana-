<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMANA | SPECIAL GIFT</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        body {
            background-color: #fce4ec;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 2;
            position: relative;
            max-width: 450px;
            width: 90%;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #f8bbd0;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
            border-radius: 30px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* كيكة عيد الميلاد مع حرف J على الجنب في الواجهة بالضبط */
        .cake-container {
            position: relative;
            font-size: 3rem;
            margin-bottom: 5px;
            display: inline-block;
            animation: bounceCake 2s infinite alternate ease-in-out;
        }

        .j-topping {
            position: absolute;
            bottom: 8px;
            right: 2px; /* ظبطناه على الجنب من جهة المشاهد تماماً */
            font-size: 1.1rem;
            font-weight: 900;
            color: #d81b60;
            background: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #f48fb1;
            box-shadow: 0 2px 6px rgba(216, 27, 96, 0.3);
            font-family: Arial, sans-serif;
            z-index: 3;
        }

        @keyframes bounceCake {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .header-title {
            font-size: 1.5rem;
            color: #ad1457;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
        }

        /* حاوية الجواب مع أنيميشن الطيران والطفو المستمر */
        .envelope-container {
            position: relative;
            margin: 25px auto 35px auto;
            animation: floatEnvelope 3s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes floatEnvelope {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .envelope-wrapper {
            position: relative;
            width: 140px;
            height: 95px;
            background: #fff;
            border: 2px solid #f48fb1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.15);
        }

        /* أنيميشن الجناحات المتحركة والطائرة */
        .wing {
            position: absolute;
            top: -18px;
            width: 55px;
            height: 45px;
            background: #ffffff;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 -3px 10px rgba(255, 255, 255, 0.9);
            z-index: -1;
        }
        
        .wing.left { 
            left: -40px; 
            transform-origin: bottom right;
            animation: flutterLeft 0.8s ease-in-out infinite alternate; 
        }
        
        .wing.right { 
            right: -40px; 
            transform-origin: bottom left;
            animation: flutterRight 0.8s ease-in-out infinite alternate; 
        }

        @keyframes flutterLeft { 
            0% { transform: rotate(-15deg) scaleY(1); } 
            100% { transform: rotate(-35deg) scaleY(0.9); } 
        }
        
        @keyframes flutterRight { 
            0% { transform: scaleX(-1) rotate(-15deg) scaleY(1); } 
            100% { transform: scaleX(-1) rotate(-35deg) scaleY(0.9); } 
        }

        .wax-seal {
            width: 34px;
            height: 34px;
            background: #c2185b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 0.9rem;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            border: 2px dashed #f8bbd0;
        }

        /* العداد التنازلي */
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            direction: ltr;
        }

        .time-block {
            background: #fdf2f8;
            border: 1px solid #fce7f3;
            padding: 10px 6px;
            border-radius: 12px;
            min-width: 65px;
            text-align: center;
        }

        .time-number {
            font-size: 1.2rem;
            font-weight: 900;
            color: #ad1457;
        }

        .time-label {
            font-size: 0.7rem;
            color: #999;
            margin-top: 2px;
            font-family: 'Cairo', sans-serif;
        }

        .status-badge {
            background: #fdf2f8;
            border: 1px solid #f48fb1;
            color: #ad1457;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .pass-input {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            outline: none;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #333;
        }

        /* نافذة الرسالة السريّة */
        .secret-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            backdrop-filter: blur(3px);
        }

        .secret-content {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 22px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            border: 1px solid #e0e0e0;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: scale(0.7);
            opacity: 0;
            animation: popupSmooth 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popupSmooth {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 15px;
            background: none; border: none;
            font-size: 1.2rem; cursor: pointer; color: #aaa;
        }

        .gold-letter-text {
            font-size: 1.1rem;
            line-height: 2.2;
            color: #b8860b;
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 0 1px 2px rgba(184, 134, 11, 0.15);
        }

        .btn-open {
            background: #ad1457;
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(173, 20, 87, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <!-- الكيكة مع حرف J على الجنب من جهة الواجهة -->
            <div class="cake-container">
                <div class="j-topping">J</div>
                🎂
            </div>

            <div class="header-title">انتظري العد التنازلي</div>
            <div class="header-subtitle">كل ثانية تقربنا من يومك...</div>

            <!-- الجواب مع الجناحات المتحركة -->
            <div class="envelope-container" onclick="tryOpenLetter()">
                <div class="envelope-wrapper">
                    <div class="wing left"></div>
                    <div class="wing right"></div>
                    <div class="wax-seal">💌</div>
                </div>
            </div>

            <!-- العد التنازلي -->
            <div class="countdown-box" id="countdownContainer">
                <div class="time-block">
                    <div class="time-number" id="days">00</div>
                    <div class="time-label">يوم</div>
                </div>
                <div class="time-block">
                    <div class="time-number" id="hours">00</div>
                    <div class="time-label">ساعة</div>
                </div>
                <div class="time-block">
                    <div class="time-number" id="minutes">00</div>
                    <div class="time-label">دقيقة</div>
                </div>
                <div class="time-block">
                    <div class="time-number" id="seconds">00</div>
                    <div class="time-label">ثانية</div>
                </div>
            </div>

            <div class="status-badge" id="statusText">
                ⏳ سيتم فتح الرسالة تلقائياً يوم 29 نوفمبر الساعة 1:00 فجراً
            </div>

            <!-- خانة إدخال الباسورد للاختبار (1129) -->
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <input type="password" id="passInput" class="pass-input" placeholder="أدخل شفرة الدخول (1129)..." oninput="checkPass()">
            </div>

        </div>
    </div>

    <!-- نافذة الرسالة المخفية -->
    <div class="secret-modal" id="secretModal">
        <div class="secret-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="gold-letter-text">
                كل سنة وأنتي طيبة يا جومانا 🎂✨<br>
                قولت اعملك حاجه مميزه تخص عيد ميلادك
            </div>
            <button class="btn-open" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const targetDate = new Date("November 29, 2026 01:00:00").getTime();
        const MY_PASS = "1129";
        let isTimeReached = false;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                isTimeReached = true;
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.getElementById("statusText").innerText = "🎉 الوقت جاء! اضغط على الجواب لفتحه";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const dictMin = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function tryOpenLetter() {
            if (isTimeReached) {
                document.getElementById("secretModal").style.display = "flex";
            } else {
                alert("🔒 لم يحن موعد فتح الرسالة بعد! (أو استخدم شفرة الدخول السرية 1129 بالأسفل)");
            }
        }

        function checkPass() {
            const val = document.getElementById("passInput").value.trim();
            if (val === MY_PASS) {
                document.getElementById("secretModal").style.display = "flex";
            }
        }

        function closeModal() {
            document.getElementById("secretModal").style.display = "none";
        }
    </script>
</body>
</html>
