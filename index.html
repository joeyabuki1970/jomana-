<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jomana 💖✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050505;
            color: #FFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الماتريكس الخفيفة */
        .matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            opacity: 0.12;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
        }

        .matrix-column {
            color: #FF3399;
            font-family: monospace;
            font-size: 1.1rem;
            writing-mode: vertical-rl;
            text-orientation: upright;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .container {
            text-align: center;
            padding: 15px;
            z-index: 2;
            position: relative;
            max-width: 480px;
            width: 92%;
        }

        /* كارت التصميم المطابق للصورة تماماً */
        .book-card {
            background: rgba(12, 12, 20, 0.92);
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.45);
            border-radius: 24px;
            padding: 25px 20px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            backdrop-filter: blur(8px);
        }

        /* شريط العد التنازلي العلوي */
        .top-timer-badge {
            background: rgba(255, 0, 127, 0.12);
            border: 1px solid rgba(255, 0, 127, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ff3399;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* القلب الضخم المنور وجواه الاسم */
        .heart-box {
            position: relative;
            width: 150px;
            height: 135px;
            margin: 5px auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseHeart 1.2s infinite ease-in-out;
        }

        .heart-box svg {
            width: 100%;
            height: 100%;
            fill: #ff007f;
            filter: drop-shadow(0 0 22px #ff007f);
        }

        .heart-name {
            position: absolute;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
            font-style: italic;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* نص بيت الشعر */
        .poem-text {
            font-size: 1.15rem;
            line-height: 2.1;
            color: #FFF;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
            margin: 10px 0 20px 0;
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 700;
        }

        /* أزرار التنقل (التالي / السابق) */
        .nav-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn {
            background: #ff007f;
            color: #FFF;
            border: none;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #ff3399;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #ff007f;
            color: #ff007f;
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 127, 0.15);
            color: #fff;
        }

        /* عداد الصفحات السفلي */
        .page-indicator {
            font-size: 0.85rem;
            color: #ff3399;
            letter-spacing: 1px;
            margin-top: 5px;
            font-weight: 700;
        }

        /* خانة الباسورد السرية للمطور تحت شاشة القفل */
        .dev-pass-box {
            margin-top: 15px;
            width: 100%;
            border-top: 1px dashed rgba(255, 0, 127, 0.4);
            padding-top: 12px;
        }

        .bypass-input {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff007f;
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            text-align: center;
            outline: none;
            font-size: 0.9rem;
            width: 85%;
            max-width: 220px;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
        }

        .bypass-input::placeholder {
            color: rgba(255, 0, 127, 0.5);
        }
    </style>
</head>
<body>

    <!-- خلفية الماتريكس -->
    <div class="matrix-bg" id="matrixBg"></div>

    <div class="container">
        <!-- الكارت الأساسي (يتحكم فيه العد التنازلي أو كلمة المرور) -->
        <div class="book-card" id="mainCard">
            
            <!-- شريط العد التنازلي العلوي -->
            <div class="top-timer-badge" id="topTimer">
                ⏳ جاري حساب الوقت...
            </div>

            <!-- القلب والاسم -->
            <div class="heart-box">
                <svg viewBox="0 0 32 29.6">
                    <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                    c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/>
                </svg>
                <span class="heart-name">jomana</span>
            </div>

            <!-- نص الشعر أو المعايدة المتغير -->
            <div class="poem-text" id="dynamicText">
                <!-- يتم تعبئته بواسطة الجافاسكريبت -->
            </div>

            <!-- أزرار التنقل -->
            <div class="nav-buttons" id="navButtons">
                <button class="btn btn-secondary" id="prevBtn" onclick="changePage(-1)">السابق</button>
                <button class="btn" id="nextBtn" onclick="changePage(1)">التالي ⬅</button>
            </div>

            <!-- العداد السفلي + خانة الباسورد السرية -->
            <div>
                <div class="page-indicator" id="pageIndicator">صفحة 1 من 6</div>
                
                <!-- خانة الباسورد السرية للمطور تحت العرض -->
                <div class="dev-pass-box" id="devPassSection">
                    <input type="text" id="devPass" class="bypass-input" placeholder="Password..." oninput="checkDevPass()">
                </div>
            </div>

        </div>
    </div>

    <script>
        // تأثير الماتريكس في الخلفية
        const matrixBg = document.getElementById('matrixBg');
        const chars = "JOMANA 2026 ♥ 1129";
        for (let i = 0; i < 14; i++) {
            const col = document.createElement('div');
            col.className = 'matrix-column';
            col.style.animationDuration = (3 + Math.random() * 4) + 's';
            col.style.animationDelay = (Math.random() * 2) + 's';
            let text = "";
            for (let j = 0; j < 18; j++) {
                text += chars.charAt(Math.floor(Math.random() * chars.length)) + "<br>";
            }
            col.innerHTML = text;
            matrixBg.appendChild(col);
        }

        // صفحة الشعر والترتيب بالظبط لكل بيت في صفحة + الصفحة الأخيرة المعايدة
        const pages = [
            "ما زلتُ أخشى في هواكِ مشاعري.. وأخاف من قلبي وفرط حناني",
            "أخشى عليكِ من المحبة إن طغت.. وأخاف أن يؤذيك فيض اهتمامي",
            "يا من سكنتِ قلبي رِفقاً بالحشى.. فالخوف يقتلني وأنتِ أمامي",
            "لو باتَ سهمٌ من الأعداء في كبدي.. ما نال مني ما نالتْهُ عيناكِ[span_1](start_span)[span_1](end_span)",
            "أغزلها وأسرف في هواها.. كأن الله لم يخلق سواها",
            "كل سنة وأنتي طيبة يا جومانا 🎉✨"
        ];

        let currentPage = 0;
        let isUnlocked = false; // يحدد إذا ميعاد العيد جه أو تم كتابة الباسورد

        function renderPage() {
            document.getElementById('dynamicText').innerText = pages[currentPage];
            document.getElementById('pageIndicator').innerText = `صفحة ${currentPage + 1} من ${pages.length}`;
            
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // إظهار أو إخفاء زر السابق
            if (currentPage === 0) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
            }

            // إظهار أو إخفاء زر التالي في الصفحة الأخيرة
            if (currentPage === pages.length - 1) {
                nextBtn.style.display = 'none';
            } else {
                nextBtn.style.display = 'block';
            }
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage >= 0 && currentPage < pages.length) {
                renderPage();
            }
        }

        // العد التنازلي المستمر (ميعاد عيد الميلاد 29 نوفمبر 2026)
        const targetDate = new Date('November 29, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                unlockSite();
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((difference % (1000 * 60)) / 1000);

            if (!isUnlocked) {
                document.getElementById('topTimer').innerHTML = `باقي لعيد الميلاد: ${days} يوم ${hours}س ${mins}د ${secs}ث ⏳`;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // كلمة المرور السرية للمطور (تفتح الموقع فوراً للتجربة)
        const MY_SECRET_PASS = "you're my love";

        function checkDevPass() {
            const val = document.getElementById('devPass').value.trim().toLowerCase();
            if (val === MY_SECRET_PASS.toLowerCase()) {
                unlockSite();
            }
        }

        function unlockSite() {
            isUnlocked = true;
            // إخفاء شريط العد التنازلي العلوي وخانة الباسورد عند الفتح الحقيقي أو بالباسورد
            document.getElementById('topTimer').style.display = 'none';
            document.getElementById('devPassSection').style.display = 'none';
            renderPage();
        }

        // الحالة الابتدائية قبل إدخال الباسورد (تعرض أول بيت شعر كمثال أو شاشة قفل، وهنا جعلناها تعرض الصفحات مع وجود خانة الباسورد تحت للتجربة السريعة)
        renderPage();
    </script>
</body>
</html>
