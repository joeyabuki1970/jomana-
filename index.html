here<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMANA | SPECIAL GIFT</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        body {
            background-color: #fce4ec;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 2;
            position: relative;
            max-width: 450px;
            width: 90%;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #f8bbd0;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
            border-radius: 30px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-height: 420px;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.5rem;
            color: #ad1457;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
        }

        /* حاوية الجواب مع أنيميشن الطيران والطفو المستمر */
        .envelope-container {
            position: relative;
            margin: 15px auto;
            animation: floatEnvelope 3s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes floatEnvelope {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .envelope-wrapper {
            position: relative;
            width: 140px;
            height: 95px;
            background: #fff;
            border: 2px solid #f48fb1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.15);
        }

        .wing {
            position: absolute;
            top: -18px;
            width: 55px;
            height: 45px;
            background: #ffffff;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 -3px 10px rgba(255, 255, 255, 0.9);
            z-index: -1;
        }
        
        .wing.left { 
            left: -40px; 
            transform-origin: bottom right;
            animation: flutterLeft 0.8s ease-in-out infinite alternate; 
        }
        
        .wing.right { 
            right: -40px; 
            transform-origin: bottom left;
            animation: flutterRight 0.8s ease-in-out infinite alternate; 
        }

        @keyframes flutterLeft { 
            0% { transform: rotate(-15deg) scaleY(1); } 
            100% { transform: rotate(-35deg) scaleY(0.9); } 
        }
        
        @keyframes flutterRight { 
            0% { transform: scaleX(-1) rotate(-15deg) scaleY(1); } 
            100% { transform: scaleX(-1) rotate(-35deg) scaleY(0.9); } 
        }

        .wax-seal {
            width: 34px;
            height: 34px;
            background: #c2185b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 0.9rem;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            border: 2px dashed #f8bbd0;
        }

        /* العداد التنازلي */
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            direction: ltr;
        }

        .time-block {
            background: #fdf2f8;
            border: 1px solid #fce7f3;
            padding: 8px 6px;
            border-radius: 12px;
            min-width: 60px;
            text-align: center;
        }

        .time-number {
            font-size: 1.1rem;
            font-weight: 900;
            color: #ad1457;
        }

        .time-label {
            font-size: 0.65rem;
            color: #999;
            margin-top: 2px;
            font-family: 'Cairo', sans-serif;
        }

        .status-badge {
            background: #fdf2f8;
            border: 1px solid #f48fb1;
            color: #ad1457;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .pass-input {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            outline: none;
            font-size: 0.85rem;
            color: #333;
        }

        /* أنيميشن بناء الكيكة وتقع في الطبق زي الفيديو بالضبط */
        .cake-scene {
            position: relative;
            width: 180px;
            height: 130px;
            margin: 10px auto;
            background: #4a2e35;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        }

        /* الطبق السفلي */
        .cake-plate {
            position: absolute;
            bottom: 10px;
            width: 150px;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
        }

        /* الكيكة وهي نازلة من فوق */
        .cake-body {
            position: absolute;
            bottom: 18px;
            width: 120px;
            height: 45px;
            background: #fdf2f8;
            border: 2px solid #f48fb1;
            border-radius: 6px;
            animation: fallCake 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* الكريمة فوق الكيكة */
        .cake-topping-cream {
            position: absolute;
            bottom: 61px;
            width: 120px;
            height: 10px;
            background: #ff4081;
            border-radius: 4px;
            animation: fallCream 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
            opacity: 0;
        }

        /* الشمعة والشمراخ */
        .cake-candle {
            position: absolute;
            bottom: 71px;
            width: 8px;
            height: 25px;
            background: #ffeb3b;
            border-radius: 2px;
            animation: fallCandle 0.5s ease 0.6s forwards;
            opacity: 0;
        }

        /* حرف J على الكيكة من الجنب */
        .cake-letter-j {
            position: absolute;
            bottom: 28px;
            right: 30px;
            font-size: 1.1rem;
            font-weight: 900;
            color: #ad1457;
            background: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            animation: fadeInLetter 0.4s ease 0.9s forwards;
            opacity: 0;
        }

        @keyframes fallCake {
            0% { transform: translateY(-120px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fallCream {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fallCandle {
            0% { transform: translateY(-80px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInLetter {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .gold-text {
            font-size: 1.1rem;
            line-height: 2.2;
            color: #b8860b;
            font-weight: 700;
            margin: 15px 0;
            text-shadow: 0 1px 2px rgba(184, 134, 11, 0.15);
            min-height: 70px;
        }

        .btn-action {
            background: #ad1457;
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(173, 20, 87, 0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصفحة الأولى: العد التنازلي والجواب -->
        <div class="card" id="page1">
            <div>
                <div class="header-title">انتظري العد التنازلي</div>
                <div class="header-subtitle">كل ثانية تقربنا من يومك...</div>
            </div>

            <div class="envelope-container" onclick="tryOpenLetter()">
                <div class="envelope-wrapper">
                    <div class="wing left"></div>
                    <div class="wing right"></div>
                    <div class="wax-seal">💌</div>
                </div>
            </div>

            <div>
                <div class="countdown-box" id="countdownContainer">
                    <div class="time-block">
                        <div class="time-number" id="days">00</div>
                        <div class="time-label">يوم</div>
                    </div>
                    <div class="time-block">
                        <div class="time-number" id="hours">00</div>
                        <div class="time-label">ساعة</div>
                    </div>
                    <div class="time-block">
                        <div class="time-number" id="minutes">00</div>
                        <div class="time-label">دقيقة</div>
                    </div>
                    <div class="time-block">
                        <div class="time-number" id="seconds">00</div>
                        <div class="time-label">ثانية</div>
                    </div>
                </div>

                <div class="status-badge" id="statusText">
                    ⏳ سيتم فتح الرسالة يوم 29 نوفمبر الساعة 1:00 فجراً
                </div>

                <div style="width: 100%; display: flex; justify-content: center;">
                    <input type="password" id="passInput" class="pass-input" placeholder="شفرة الدخول (1129)..." oninput="checkPass()">
                </div>
            </div>
        </div>

        <!-- الصفحة التانية: الكيكة وهي بتنزل والجملة الأولى -->
        <div class="card" id="page2" style="display: none;">
            <div>
                <div class="header-title" style="font-size: 1.2rem;">رسالة خاصة 🎂</div>
            </div>

            <!-- أنيميشن بناء الكيكة المظبوط زي الفيديو -->
            <div class="cake-scene">
                <div class="cake-plate"></div>
                <div class="cake-body"></div>
                <div class="cake-topping-cream"></div>
                <div class="cake-candle"></div>
                <div class="cake-letter-j">J</div>
            </div>

            <div class="gold-text">
                كل سنة وأنتي طيبة يا جومانا 🎂✨
            </div>

            <button class="btn-action" onclick="goToPage3()">التالي ⬅</button>
        </div>

        <!-- الصفحة التالتة: الجملة التانية والختام -->
        <div class="card" id="page3" style="display: none;">
            <div>
                <div class="header-title" style="font-size: 1.2rem;">هدية مميزة ✨</div>
            </div>

            <div style="font-size: 3.5rem; margin: 20px 0;">🎁</div>

            <div class="gold-text">
                قولت اعملك حاجه مميزه تخص عيد ميلادك 🥳
            </div>

            <button class="btn-action" onclick="resetToHome()">إغلاق 🤍</button>
        </div>
    </div>

    <script>
        const targetDate = new Date("November 29, 2026 01:00:00").getTime();
        const MY_PASS = "1129";
        let isTimeReached = false;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                isTimeReached = true;
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.getElementById("statusText").innerText = "🎉 الوقت جاء! اضغط على الجواب لفتحه";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function tryOpenLetter() {
            if (isTimeReached) {
                openPage2();
            } else {
                alert("🔒 لم يحن موعد فتح الرسالة بعد! (أو استخدم شفرة الدخول السرية 1129 بالأسفل)");
            }
        }

        function checkPass() {
            const val = document.getElementById("passInput").value.trim();
            if (val === MY_PASS) {
                openPage2();
            }
        }

        function openPage2() {
            document.getElementById("page1").style.display = "none";
            document.getElementById("page2").style.display = "flex";
            document.getElementById("page3").style.display = "none";
        }

        function goToPage3() {
            document.getElementById("page2").style.display = "none";
            document.getElementById("page3").style.display = "flex";
        }

        function resetToHome() {
            document.getElementById("passInput").value = "";
            document.getElementById("page3").style.display = "none";
            document.getElementById("page1").style.display = "flex";
        }
    </script>
</body>
</html>
