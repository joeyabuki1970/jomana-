<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMANA | SPECIAL GIFT</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        body {
            background-color: #fce4ec;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 2;
            position: relative;
            max-width: 450px;
            width: 90%;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border: 2px solid #f8bbd0;
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
            border-radius: 30px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .header-title {
            font-size: 1.5rem;
            color: #ad1457;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
        }

        /* شكل الجواب والجناحات */
        .envelope-wrapper {
            position: relative;
            width: 160px;
            height: 110px;
            background: #fff;
            border: 2px solid #f48fb1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto 35px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .wing {
            position: absolute;
            top: -15px;
            width: 50px;
            height: 40px;
            background: #fff;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 -2px 10px rgba(255,255,255,0.8);
            z-index: -1;
        }
        .wing.left { left: -35px; transform: rotate(-20deg); animation: flutterLeft 1.5s infinite alternate; }
        .wing.right { right: -35px; transform: scaleX(-1) rotate(-20deg); animation: flutterRight 1.5s infinite alternate; }

        @keyframes flutterLeft { 0% { transform: rotate(-15deg); } 100% { transform: rotate(-30deg); } }
        @keyframes flutterRight { 0% { transform: scaleX(-1) rotate(-15deg); } 100% { transform: scaleX(-1) rotate(-30deg); } }

        .wax-seal {
            width: 36px;
            height: 36px;
            background: #c2185b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            border: 2px dashed #f8bbd0;
        }

        /* العداد التنازلي */
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .time-block {
            background: #fdf2f8;
            border: 1px solid #fce7f3;
            padding: 10px 8px;
            border-radius: 12px;
            min-width: 65px;
            text-align: center;
        }

        .time-number {
            font-size: 1.2rem;
            font-weight: 900;
            color: #ad1457;
        }

        .time-label {
            font-size: 0.7rem;
            color: #999;
            margin-top: 2px;
        }

        .status-badge {
            background: #fdf2f8;
            border: 1px solid #f48fb1;
            color: #ad1457;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .pass-input {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            outline: none;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #333;
        }

        /* نافذة الرسالة السريّة (صفحة بيضاء بخط ذهبي كالجواب الفاخر) */
        .secret-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }

        .secret-content {
            background: #ffffff;
            padding: 40px 25px;
            border-radius: 20px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            border: 1px solid #e0e0e0;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 15px;
            background: none; border: none;
            font-size: 1.2rem; cursor: pointer; color: #aaa;
        }

        /* الحروف بخط ذهبي جميل كأنه جواب حقيقي */
        .gold-letter-text {
            font-size: 1.15rem;
            line-height: 2.2;
            color: #b8860b; /* لون ذهبي دافئ وواضح */
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 0 1px 2px rgba(184, 134, 11, 0.15);
        }

        .btn-open {
            background: #ad1457;
            color: #fff;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(173, 20, 87, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <div class="header-title">انتظري العد التنازلي</div>
            <div class="header-subtitle">كل ثانية تقربنا من يومك...</div>

            <!-- الجواب والختم والجناحات -->
            <div class="envelope-wrapper" id="envelopeBtn" onclick="tryOpenLetter()">
                <div class="wing left"></div>
                <div class="wing right"></div>
                <div class="wax-seal">💌</div>
            </div>

            <!-- العد التنازلي -->
            <div class="countdown-box" id="countdownContainer">
                <div class="time-block">
                    <div class="time-number" id="days">00</div>
                    <div class="time-label">يوم</div>
                </div>
                <div class="time-block">
                    <div class="time-number" id="hours">00</div>
                    <div class="time-label">ساعة</div>
                </div>
                <div class="time-block">
                    <div class="time-number" id="minutes">00</div>
                    <div class="time-label">دقيقة</div>
                </div>
                <div class="time-block">
                    <div class="time-number" id="seconds">00</div>
                    <div class="time-label">ثانية</div>
                </div>
            </div>

            <div class="status-badge" id="statusText">
                ⏳ سيتم فتح الرسالة تلقائياً يوم 29 نوفمبر الساعة 1:00 فجراً
            </div>

            <!-- خانة إدخال الباسورد للاختبار (1129) -->
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <input type="password" id="passInput" class="pass-input" placeholder="أدخل شفرة الدخول (1129)..." oninput="checkPass()">
            </div>

        </div>
    </div>

    <!-- نافذة الرسالة المخفية (الصفحة البيضاء والخط الذهبي) -->
    <div class="secret-modal" id="secretModal">
        <div class="secret-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="gold-letter-text">
                كل سنة و انتي طيبه يا جومانا<br>
                قولت اعملك حاجه مميزه لعيد ميلادك 😔🖐🏿<br><br>
                كل سنه و انتي طيبه 🥳🥳
            </div>
            <button class="btn-open" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        // موعد الفتح: 29 نوفمبر 2026 الساعة 01:00 صباحاً (1 فجراً)
        const targetDate = new Date("November 29, 2026 01:00:00").getTime();
        const MY_PASS = "1129";
        let isTimeReached = false;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                isTimeReached = true;
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.getElementById("statusText").innerText = "🎉 الوقت جاء! اضغط على الجواب لفتحه";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function tryOpenLetter() {
            if (isTimeReached) {
                document.getElementById("secretModal").style.display = "flex";
            } else {
                alert("🔒 لم يحن موعد فتح الرسالة بعد! (أو استخدم شفرة الدخول السرية 1129 بالأسفل)");
            }
        }

        function checkPass() {
            const val = document.getElementById("passInput").value.trim();
            if (val === MY_PASS) {
                document.getElementById("secretModal").style.display = "flex";
            }
        }

        function closeModal() {
            document.getElementById("secretModal").style.display = "none";
        }
    </script>
</body>
</html>
