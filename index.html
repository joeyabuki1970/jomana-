<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOMANA | SPECIAL GIFT</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050505;
            color: #FFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية الماتريكس الخفيفة */
        .matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            opacity: 0.12;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
        }

        .matrix-column {
            color: #FF3399;
            font-family: monospace;
            font-size: 1.1rem;
            writing-mode: vertical-rl;
            text-orientation: upright;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .container {
            text-align: center;
            padding: 15px;
            z-index: 2;
            position: relative;
            max-width: 480px;
            width: 92%;
        }

        /* كارت التصميم */
        .book-card {
            background: rgba(12, 12, 20, 0.92);
            border: 2px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.45);
            border-radius: 24px;
            padding: 25px 20px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            backdrop-filter: blur(8px);
        }

        /* شريط العد التنازلي أرقام فقط */
        .top-timer-badge {
            background: rgba(255, 0, 127, 0.12);
            border: 1px solid rgba(255, 0, 127, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #ff3399;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            direction: ltr;
        }

        /* القلب الضخم المنور وجواه الاسم */
        .heart-box {
            position: relative;
            width: 150px;
            height: 135px;
            margin: 5px auto 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseHeart 1.2s infinite ease-in-out;
        }

        .heart-box svg {
            width: 100%;
            height: 100%;
            fill: #ff007f;
            filter: drop-shadow(0 0 22px #ff007f);
        }

        .heart-name {
            position: absolute;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
            font-style: italic;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* نص بيت الشعر أو خانة الباسورد */
        .poem-text {
            font-size: 1.1rem;
            line-height: 2.1;
            color: #FFF;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7);
            margin: 5px 0 15px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 700;
        }

        /* خانة الباسورد السرية */
        .dev-pass-input {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ff007f;
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            text-align: center;
            outline: none;
            font-size: 0.9rem;
            width: 80%;
            max-width: 200px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
            margin-bottom: 10px;
        }

        .dev-pass-input::placeholder {
            color: rgba(255, 0, 127, 0.6);
        }

        /* أزرار التنقل */
        .nav-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-bottom: 5px;
        }

        .btn {
            background: #ff007f;
            color: #FFF;
            border: none;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #ff3399;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #ff007f;
            color: #ff007f;
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 127, 0.15);
            color: #fff;
        }

        /* زر تشغيل الموسيقى بعد فتح الموقع */
        .music-btn {
            background: linear-gradient(45deg, #ff007f, #ff3399);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* عداد الصفحات السفلي */
        .page-indicator {
            font-size: 0.85rem;
            color: #ff007f;
            letter-spacing: 1px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- خلفية الماتريكس -->
    <div class="matrix-bg" id="matrixBg"></div>

    <!-- عنصر الصوت للأغنية -->
    <audio id="bgAudio" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=slowed-guitar-113532.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="book-card" id="mainCard">
            
            <!-- شريط العد التنازلي -->
            <div class="top-timer-badge" id="topTimer">
                ⏳ 00d 00h 00m 00s
            </div>

            <!-- زر تشغيل الموسيقى (يظهر فقط بعد فتح الموقع) -->
            <button class="music-btn" id="musicBtn" style="display: none;" onclick="toggleMusic()">🎵 تشغيل الموسيقى</button>

            <!-- القلب والاسم -->
            <div class="heart-box">
                <svg viewBox="0 0 32 29.6">
                    <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                    c6.5-9.3,16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/>
                </svg>
                <span class="heart-name">jomana</span>
            </div>

            <!-- مكان عرض الشعر أو خانة الباسورد -->
            <div class="poem-text" id="displayArea">
                <!-- يتم التبديل هنا -->
            </div>

            <!-- أزرار التنقل -->
            <div class="nav-buttons" id="navButtons">
                <button class="btn btn-secondary" id="prevBtn" onclick="changePage(-1)">السابق</button>
                <button class="btn" id="nextBtn" onclick="changePage(1)">التالي ⬅</button>
            </div>

            <!-- العداد السفلي -->
            <div class="page-indicator" id="pageIndicator">صفحة 1 من 6</div>

        </div>
    </div>

    <script>
        // تأثير الماتريكس في الخلفية
        const matrixBg = document.getElementById('matrixBg');
        const chars = "JOMANA 2026 ♥ 1129";
        for (let i = 0; i < 14; i++) {
            const col = document.createElement('div');
            col.className = 'matrix-column';
            col.style.animationDuration = (3 + Math.random() * 4) + 's';
            col.style.animationDelay = (Math.random() * 2) + 's';
            let text = "";
            for (let j = 0; j < 18; j++) {
                text += chars.charAt(Math.floor(Math.random() * chars.length)) + "<br>";
            }
            col.innerHTML = text;
            matrixBg.appendChild(col);
        }

        // أبيات الشعر والصفحة الأخيرة المعايدة
        const pages = [
            "ما زلتُ أخشى في هواكِ مشاعري.. وأخاف من قلبي وفرط حناني",
            "أخشى عليكِ من المحبة إن طغت.. وأخاف أن يؤذيك فيض اهتمامي",
            "يا من سكنتِ قلبي رِفقاً بالحشى.. فالخوف يقتلني وأنتِ أمامي",
            "لو باتَ سهمٌ من الأعداء في كبدي.. ما نال مني ما نالتْهُ عيناكِ",
            "أغزلها وأسرف في هواها.. كأن الله لم يخلق سواها",
            "كل سنة وأنتي طيبة يا جومانا 🎉✨"
        ];

        let currentPage = 0;
        let isUnlocked = false;
        let isPlaying = false;

        // كلمة المرور السرية
        const MY_SECRET_PASS = "you're my love";

        function toggleMusic() {
            const audio = document.getElementById('bgAudio');
            const musicBtn = document.getElementById('musicBtn');
            if (audio) {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    musicBtn.innerHTML = "🎵 تشغيل الموسيقى";
                } else {
                    audio.play().then(() => {
                        isPlaying = true;
                        musicBtn.innerHTML = "⏸ إيقاف الموسيقى";
                    }).catch(e => {
                        console.log("Play blocked");
                    });
                }
            }
        }

        function renderSite() {
            const displayArea = document.getElementById('displayArea');
            const navButtons = document.getElementById('navButtons');
            const pageIndicator = document.getElementById('pageIndicator');
            const topTimer = document.getElementById('topTimer');
            const musicBtn = document.getElementById('musicBtn');

            if (!isUnlocked) {
                topTimer.style.display = 'inline-flex';
                musicBtn.style.display = 'none';
                navButtons.style.display = 'none';
                pageIndicator.style.display = 'none';
                
                displayArea.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                        <div style="font-size: 0.9rem; margin-bottom: 12px; color: #ff3399; letter-spacing: 1px;">الموقع مغلق حتى الميعاد 🔒</div>
                        <input type="text" id="devPass" class="dev-pass-input" placeholder="...Password" oninput="checkDevPass()">
                    </div>
                `;
            } else {
                topTimer.style.display = 'none';
                musicBtn.style.display = 'inline-flex';
                navButtons.style.display = 'flex';
                pageIndicator.style.display = 'block';

                displayArea.innerText = pages[currentPage];
                pageIndicator.innerText = `صفحة ${currentPage + 1} من ${pages.length}`;

                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');

                if (currentPage === 0) {
                    prevBtn.style.display = 'none';
                } else {
                    prevBtn.style.display = 'block';
                }

                if (currentPage === pages.length - 1) {
                    nextBtn.style.display = 'none';
                } else {
                    nextBtn.style.display = 'block';
                }
            }
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage >= 0 && currentPage < pages.length) {
                renderSite();
            }
        }

        // عداد الوقت
        const targetDate = new Date('November 29, 2026 00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                unlockSite();
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((difference % (1000 * 60)) / 1000);

            if (!isUnlocked) {
                document.getElementById('topTimer').innerHTML = `⏳ ${days}d ${hours}h ${mins}m ${secs}s`;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function checkDevPass() {
            const val = document.getElementById('devPass').value.trim().toLowerCase();
            if (val === MY_SECRET_PASS.toLowerCase()) {
                unlockSite();
            }
        }

        function unlockSite() {
            isUnlocked = true;
            renderSite();
            // محاولة التشغيل التلقائي فور إدخال الباسورد
            const audio = document.getElementById('bgAudio');
            const musicBtn = document.getElementById('musicBtn');
            if (audio) {
                audio.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerHTML = "⏸ إيقاف الموسيقى";
                }).catch(e => {
                    console.log("Auto-play restricted by browser, user can click the music button");
                });
            }
        }

        renderSite();
    </script>
</body>
</html>
